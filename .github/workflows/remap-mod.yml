name: remap-mod
on:
  push:
    branches: [port-tools]
permissions:
  contents: write
jobs:
  remap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12.1'
      - name: remap jar intermediary -> mojmap (1.21.1)
        run: |
          exec > >(tee -a /tmp/all.log) 2>&1
          mkdir -p /tmp/rm/libs && cd /tmp/rm
          cp "$GITHUB_WORKSPACE"/jar/DEDsafio4RuletaFanProjectFabric-1_3_0.jar libs/mod.jar
          cat > settings.gradle <<'S'
          pluginManagement { repositories { maven { url 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() } }
          rootProject.name='rm'
          S
          cat > build.gradle <<'S'
          plugins { id 'fabric-loom' version '1.9.2' }
          repositories { mavenCentral() }
          dependencies {
            minecraft 'com.mojang:minecraft:1.21.1'
            mappings loom.officialMojangMappings()
            modImplementation 'net.fabricmc:fabric-loader:0.16.10'
            modImplementation 'net.fabricmc.fabric-api:fabric-api:0.105.0+1.21.1'
            modImplementation files('libs/mod.jar')
          }
          S
          gradle --no-daemon build -x test || gradle --no-daemon classes || true
          find ~/.gradle /tmp/rm -path '*remapped_mods*' -name '*.jar' | tee /tmp/found.txt; test -s /tmp/found.txt
      - name: decompile
        run: |
          exec > >(tee -a /tmp/all.log) 2>&1
          cd /tmp
          V=$(curl -s https://repo1.maven.org/maven2/org/vineflower/vineflower/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          curl -sL -o vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/$V/vineflower-$V.jar
          J=$(grep -i 'mod' /tmp/found.txt | grep -vi 'fabric-api\|fabric-loader\|fabric_api' | head -1); echo "jar: $J"
          mkdir -p dec && java -Xmx6g -jar vf.jar -dgs=1 -log=WARN "$J" dec/
          mkdir -p jarx && cd jarx && unzip -q "$J"
          ls /tmp/dec
      - name: publish remapped sources to branch mojmap-src
        run: |
          exec > >(tee -a /tmp/all.log) 2>&1
          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan mojmap-src
          git rm -rq --cached . ; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p src/main/java src/main/resources
          unzip -q /tmp/dec/*.jar -d src/main/java
          (cd /tmp/jarx && find . -type f ! -name '*.class' ! -path './META-INF/*' -print0 | cpio -0pdm "$GITHUB_WORKSPACE/src/main/resources")
          git add -A && git commit -q -m "mod remapped to mojmap 1.21.1 and decompiled"
          git push -f origin mojmap-src
      - name: publish log
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan mojmap-log 2>/dev/null || true
          git rm -rq --cached . 2>/dev/null; find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tail -c 200000 /tmp/all.log > log.txt
          git add log.txt && git commit -q -m log && git push -f origin mojmap-log
