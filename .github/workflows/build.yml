name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexo-26.3-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Nexo (criaturas e ítems) (build ${{ github.run_number }})
          body: |
            Nexo (criaturas e ítems) para Minecraft 26.3 (Fabric).
            Necesita Fabric API 0.166.2+26.3 y GeckoLib 26.3-5.5.7 (o más nuevos).
          files: build/libs/nexo-26.3-1.0.0.jar
          make_latest: false
      - name: prueba en servidor
        if: always()
        shell: bash {0}
        run: |
          mkdir -p run && echo eula=true > run/eula.txt && printf 'online-mode=false\nspawn-protection=0\n' > run/server.properties
          ( for i in $(seq 1 200); do grep -q 'Done (' run/logs/latest.log 2>/dev/null && break; sleep 3; done; sleep 5; while read -r l; do echo "$l"; sleep 3; done < .github/comandos.txt; sleep 30; echo stop ) | timeout 1200 ./gradlew runServer --console=plain > server.log 2>&1
          grep -vE '^\s+at |DEBUG' server.log | grep -E 'ERROR|WARN|Exception|Caused|Couldn|Failed|nexo|Done|Unknown|Missing|No key|Not a|Invalid|template-mod' | grep -vE 'FabricLoader/Mixin|Environment:' | head -400
