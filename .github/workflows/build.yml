# Compila el mod en cada push y, en la rama menu-g, publica el .jar como release.
name: build
on: [pull_request, push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/menu-g'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: menu-g-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ruleta Menú G 26.3 (build ${{ github.run_number }})
          body: |
            Mod del menú G de la Ruleta para Minecraft 26.3 (Fabric).
            Descarga `ruleta-menu-g-26.3-1.0.0.jar` y ponlo en la carpeta mods junto con Fabric API 0.166.2+26.3 o más nueva.
          files: build/libs/ruleta-menu-g-26.3-1.0.0.jar
          make_latest: true
