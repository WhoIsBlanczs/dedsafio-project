name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ruleta
          path: build/libs/*.jar
      - name: Publicar release con el jar
        if: github.ref == 'refs/heads/ruleta' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          cp "$JAR" Ruleta-26.3.jar
          gh release delete ruleta-latest --cleanup-tag --yes || true
          gh release create ruleta-latest Ruleta-26.3.jar --target "$GITHUB_SHA" --title "Ruleta (Minecraft 26.3)" --notes "Descargá Ruleta-26.3.jar y ponelo en la carpeta mods (Fabric Loader 0.19.5+, Fabric API, Java 25)."
