name: herramientas
on: [push, workflow_dispatch]
jobs:
  h:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - name: buscar geckolib
        run: |
          for g in software/bernie/geckolib com/geckolib; do
            echo "== $g"; curl -s https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/$g/geckolib-fabric-26.3/maven-metadata.xml | head -30
          done
      - name: mapeos 1.21.1
        run: |
          mkdir -p out
          curl -sL https://maven.fabricmc.net/net/fabricmc/intermediary/1.21.1/intermediary-1.21.1-v2.jar -o i.jar
          unzip -p i.jar mappings/mappings.tiny > out/intermediary-1.21.1.tiny
          V=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[]|select(.id=="1.21.1")|.url')
          J=$(curl -s $V)
          curl -sL $(echo "$J" | jq -r .downloads.client_mappings.url) -o out/client-1.21.1.txt
          curl -sL $(echo "$J" | jq -r .downloads.server_mappings.url) -o out/server-1.21.1.txt
          ls -la out
      - name: classpath 26.3
        run: chmod +x gradlew && ./gradlew exportarClasspath --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: herramientas
          path: |
            out/
            build/cp/
