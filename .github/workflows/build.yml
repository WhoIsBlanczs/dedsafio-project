name: herramientas
on: [push, workflow_dispatch]
jobs:
  h:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - name: classpath 26.3
        run: chmod +x gradlew && ./gradlew exportarClasspath -q
      - name: sondeo
        shell: bash {0}
        run: |
          cd build/cp
          CP=$(ls *.jar | tr '\n' ':')
          echo "=====SONDEO====="
          if [ -f ../../herr/cmd.sh ]; then bash ../../herr/cmd.sh; else javap -p -cp "$CP" $(cat ../../herr/sondeo.txt); fi
          echo "=====FIN====="
