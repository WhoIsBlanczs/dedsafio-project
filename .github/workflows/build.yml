name: herramientas
on: [push, workflow_dispatch]
jobs:
  h:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - name: classpath 26.3
        run: chmod +x gradlew && ./gradlew exportarClasspath -q
      - name: stubs
        shell: bash {0}
        run: |
          cd build/cp; ls
          J=$(ls *.jar | grep -v -E 'lwjgl|netty|natives|msal4j|azure|jna|text2speech|icu4j|oshi|jtracy|-sources')
          java ../../herr/Strip.java /tmp/stubs.jar $J 2>&1 | tail -5
          ls -la /tmp/stubs.jar
          echo "=====B64====="; base64 -w 2000 /tmp/stubs.jar; echo "=====FIN====="
