name: sondeo
on:
  push:
    branches: [sondeo]
jobs:
  s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: chmod +x ./gradlew && ./gradlew compileJava --no-daemon -q || true
      - name: javap
        run: |
          MC=$(find ~/.gradle .gradle -name '*.jar' -size +10M 2>/dev/null | while read j; do unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class' && echo "$j"; done | head -1)
          echo "MC=$MC"
          javap -cp "$MC" -constants com.mojang.blaze3d.platform.InputConstants | grep -iE "MOUSE|KEY_G " | head -20
          javap -cp "$MC" net.minecraft.client.input.MouseButtonEvent net.minecraft.client.input.MouseButtonInfo net.minecraft.client.input.InputWithModifiers 2>&1 | head -60
