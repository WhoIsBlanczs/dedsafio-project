name: decomp
on:
  push:
    branches: [decomp]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle --no-daemon build -x test || true
      - name: Localizar jar remapeado
        run: |
          find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i -E "ded|remapped" | head -20
      - name: Decompilar
        run: |
          J=$(find . ~/.gradle -path '*remapped_mods*' -name '*.jar' 2>/dev/null | xargs -I{} sh -c 'unzip -l {} | grep -q "net/ruleta/RuletaInicio" && echo {}' | head -1)
          echo "jar=$J"
          curl -sL -o vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir out && java -jar vf.jar -log=ERROR "$J" out
          cd out && unzip -qo *.jar 2>/dev/null; rm -f *.jar; ls | head
      - name: Publicar fuentes
        run: |
          cd out
          git init -q && git checkout -q -b decomp-out
          git add -A && git -c user.name=ci -c user.email=ci@x commit -qm sources
          git remote add o "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git push -f o decomp-out
