name: port-build
on:
  push:
    branches: [port-26.3]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: |
          set +e
          ./gradlew build --no-daemon --console=plain > /tmp/build.log 2>&1
          echo $? > /tmp/build.rc
          exit 0
      - name: publish log and jar
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pub
          head -c 900000 /tmp/build.log > /tmp/pub/build.log
          echo "exit=$(cat /tmp/build.rc)" > /tmp/pub/status.txt
          ls build/libs 2>/dev/null >> /tmp/pub/status.txt
          cp build/libs/*[0-9].jar /tmp/pub/ 2>/dev/null || true
          git config user.name github-actions; git config user.email actions@github.com
          git symbolic-ref HEAD refs/heads/port-result; rm -f .git/index
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/pub/* .
          git add -A
          git commit -q -m "build result"
          git push -f origin port-result
