# Temporal: arranca un servidor con el mod para comprobar que carga.
name: prueba-servidor
on:
  push:
    branches: [menu-g-dev2]
jobs:
  servidor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: chmod +x ./gradlew
      - name: arrancar servidor
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          (sleep 400; echo stop) | timeout 600 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          grep -nE "Done \(|ruleta|Mixin|mixin|ERROR|Exception" server.log | head -80
          grep -q "Done (" server.log
