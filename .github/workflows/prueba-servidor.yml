# Temporal: arranca un servidor con el mod y CasinoHS para comprobar los mixins.
name: prueba-servidor
on:
  push:
    branches: [menu-g-dev2]
jobs:
  servidor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: chmod +x ./gradlew && ./gradlew build --no-daemon -q
      - name: mods de prueba
        run: |
          MC=$(find ~/.gradle .gradle -name '*.jar' -size +10M 2>/dev/null | while read j; do unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/item/trading/MerchantOffers.class' && echo "$j"; done | head -1)
          echo "MC=$MC"
          mkdir -p falso-out run/mods
          javac --release 25 -cp "$MC" -d falso-out prueba/falso/ar/hombrosafio/CasinoExchange.java
          cp prueba/falso/fabric.mod.json falso-out/
          (cd falso-out && jar cf ../run/mods/hombrosafio-falso.jar .)
          cp prueba/casinohs.jar run/mods/
          ls -la run/mods
      - name: arrancar servidor
        run: |
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\n" > run/server.properties
          (sleep 300; echo stop) | JAVA_TOOL_OPTIONS=-Druleta.autoprueba=1 timeout 500 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          grep -nE "Done \(|RULETA|Mixin|mixin|ERROR|Exception|casinohs" server.log | head -80
          grep -q "RULETA-AUTOPRUEBA OK" server.log
